# Builds the static website on every push to dev/main and on pull requests; copies it to the
# team server (Caddy serves it, stack in traffic-event-detection/deploy) only after a merge
# into main, and only once the repository variable DEPLOY_ENABLED is "true".
name: Build and deploy website

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # Same origin as the site by default; override if the API lives elsewhere.
          VITE_API_BASE: ${{ vars.API_BASE || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - name: Upload to the server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: dist/*
          # staged in /tmp: the deploy user owns SITE_DIR but not its parent directory
          target: /tmp/site-incoming-${{ github.run_id }}
          strip_components: 1
      - name: Publish
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # sync in place (keeps SITE_DIR itself, which Caddy serves), then drop the staging copy
          script: |
            set -e
            rsync -a --delete '/tmp/site-incoming-${{ github.run_id }}/' '${{ vars.SITE_DIR }}/'
            rm -rf '/tmp/site-incoming-${{ github.run_id }}'
